url: https://statmodels7.github.io/distributions7

template:
  bootstrap: 5
  bslib:
    primary: "#0F2A3F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Distributions as reusable objects
  description: >
    Probability distributions written once, as objects any package can use,
    carrying exact derivatives of the log-likelihood to fourth order — with
    respect to the parameters, the response, and the unconstrained scale an
    optimizer works on.

navbar:
  structure:
    left:  [intro, reference, articles]
    right: [search, book, statmodels7, github]
  components:
    book:
      text: book
      href: https://statmodels7.github.io/book/
    statmodels7:
      text: statmodels7
      href: https://statmodels7.github.io

articles:
- title: Getting started
  navbar: ~
  contents:
  - fitting-a-model
  - defining-a-distribution
  - derivatives-and-the-link-scale

reference:
- title: Distributions
  desc: >

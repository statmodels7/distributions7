    to the unconstrained parameters.
  contents:
  - distrib_gradient
  - distrib_hessian
  - distrib_expected_hessian
  - distrib_deriv3
  - distrib_deriv4
  - distrib_grad_y
  - distrib_hess_y
  - distrib_cross_y
  - distrib_grad_cdf
  - distrib_hess_cdf
  - link_scale_derivatives
  - expected_derivative_methods

- title: Estimation
  contents:
  - fit_distrib
  - fisher_scoring
  - FisherScoring
  - distrib_start
  - distrib_fit_class
  - check_distrib

- title: Moments
  contents:
  - expectation
  - moment
  - mean.distrib
  - variance
  - std_dev
  - skewness
  - kurtosis
  - moment_const
  - gengamma_raw_moments
  - betabinom_factorial_moments
  - central_from_factorial
  - betabinom_central

- title: Building on a distribution
  desc: >
    Wrappers that turn a distribution into another one: a mixture with a point
    mass at zero, a restriction to an interval, the law of a transformed
    variable, or the same law with some parameters held at known values.
  contents:
  - zero_inflated
  - zero_adjusted
  - truncated
  - folded
  - reparametrize
  - fixed
  - transformation
  - transformer
  - starts_with("log_transform")
  - ends_with("_transform")

- title: Several dimensions
  desc: >
    Distributions whose observations are vectors. The response is a matrix with
    one row per observation, and the parameters stay scalars: a mean vector
    contributes one each, and a covariance contributes the free values of the
    parameters7 structure that parametrizes it, so every generic of the package
    indexes them as it always did.
  contents:
  - mvgaussian_distrib
  - mvstudent_t_distrib
  - dirichlet_distrib
  - multinomial_distrib
  - mv_location
  - mv_marginal
  - mv_support
  - mv_reference_draw
  - mv_derived
  - mv_summary
  - n_obs

- title: Classes
  desc: The S7 classes; each page lists the methods that dispatch on it.
  contents:
  - distrib
  - continuous_distrib
  - discrete_distrib
  - multivariate_distrib

- title: Numerical fallbacks
  desc: >
    What a distribution gets for free when it implements only its density.
    Rarely called directly, but useful as a reference for what is happening.
  contents:
